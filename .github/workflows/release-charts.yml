name: Release Helm charts

# Publishes charts/ as a Helm repo on GitHub Pages (gh-pages branch) so customers
# can `helm repo add velai https://guhatek-saas.github.io/velai-oss`. One-time
# setup: enable GitHub Pages for this repo, serving from the gh-pages branch.

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/velai

      - name: Release charts to gh-pages
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
