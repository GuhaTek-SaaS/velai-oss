{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "velai.serviceAccountName" . }}
  labels: {{- include "velai.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# The Admin Console reads agent Deployments to show health (RAG status) and reads
# the kube-system namespace UID for the licence cluster binding (Guard 1). This
# Role grants only those read verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "velai.fullname" . }}-console
  labels: {{- include "velai.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- if .Values.pullRefresh.enabled }}
  # Image-pull secret refresh: create it, then get/patch only that one secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.pullRefresh.secretName | quote }}]
    verbs: ["get", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "velai.fullname" . }}-console
  labels: {{- include "velai.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "velai.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "velai.fullname" . }}-console
  apiGroup: rbac.authorization.k8s.io
---
# kube-system namespace UID read (Guard 1) — a namespaced read isn't enough, so a
# tightly-scoped ClusterRole limited to GET on namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "velai.fullname" . }}-{{ .Release.Namespace }}-ns-read
  labels: {{- include "velai.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "velai.fullname" . }}-{{ .Release.Namespace }}-ns-read
  labels: {{- include "velai.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "velai.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "velai.fullname" . }}-{{ .Release.Namespace }}-ns-read
  apiGroup: rbac.authorization.k8s.io
