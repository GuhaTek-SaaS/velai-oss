{{- if and .Values.adminConsole.enabled .Values.adminConsole.ingress.enabled }}
{{- $fn := include "velai.fullname" . }}
{{- $ing := .Values.adminConsole.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fn }}-admin-console
  labels: {{- include "velai.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $ing.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fn }}-admin-console
                port:
                  number: {{ .Values.adminConsole.port }}
{{- end }}
